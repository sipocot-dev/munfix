services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: munfix
      POSTGRES_PASSWORD: munfix
      POSTGRES_DB: munfix
    ports:
      - "127.0.0.1:5432:5432" # local only: the dev password is public
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munfix -d munfix"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379" # local only: Redis has no password here
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development mail catcher: every email the app sends lands here instead of a real inbox.
  # SMTP on 127.0.0.1:1025, web UI on http://localhost:8025. Bound to this machine only; never deploy it.
  # This is for email only: MunFix has no in-app notifications (see docs/mailpit.md).
  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI and API
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full stack in containers: docker compose --profile full up --build
  app:
    profiles: ["full"]
    build:
      context: .
      args:
        NEXT_PUBLIC_MUNICIPALITY_NAME: ${NEXT_PUBLIC_MUNICIPALITY_NAME:-Sipocot}
        NEXT_PUBLIC_PROVINCE_NAME: ${NEXT_PUBLIC_PROVINCE_NAME:-Camarines Sur}
        NEXT_PUBLIC_MAP_CENTER_LNG: ${NEXT_PUBLIC_MAP_CENTER_LNG:-122.9833}
        NEXT_PUBLIC_MAP_CENTER_LAT: ${NEXT_PUBLIC_MAP_CENTER_LAT:-13.7667}
        NEXT_PUBLIC_MAP_BOUNDS: ${NEXT_PUBLIC_MAP_BOUNDS:-122.70,13.50,123.25,14.05}
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_MAP_STYLE_URL_DARK: ${NEXT_PUBLIC_MAP_STYLE_URL_DARK:-}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
    environment:
      DATABASE_URL: postgres://munfix:munfix@db:5432/munfix
      REDIS_URL: redis://redis:6379
      APP_URL: ${APP_URL:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PREFIX: ${S3_PREFIX:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-true} # local only: refused unless APP_URL is localhost
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_FACEBOOK_ID: ${AUTH_FACEBOOK_ID:-}
      AUTH_FACEBOOK_SECRET: ${AUTH_FACEBOOK_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_FACEBOOK_CLIENT_ID: ${OAUTH_FACEBOOK_CLIENT_ID:-}
      OAUTH_FACEBOOK_CLIENT_SECRET: ${OAUTH_FACEBOOK_CLIENT_SECRET:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@munfix.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-me-please}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
